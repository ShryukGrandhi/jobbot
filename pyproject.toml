[project]
name = "jobbot"
version = "0.1.0"
description = "Autonomous job-application agent: finds roles, tailors a one-page resume, fills and verifies applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "cloakbrowser>=0.5.10",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "keyring>=25.0",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "pydantic[email]>=2.9",
    "pypdfium2>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-jobspy>=1.1.80",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "reportlab>=4.0",
    "structlog>=24.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobbot = "jobbot.cli:main"

[project.urls]
Homepage = "https://github.com/ShryukGrandhi/jobbot"
Issues = "https://github.com/ShryukGrandhi/jobbot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobbot"]
